[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "authplane-secured-github-mcp"
version = "0.1.0"
description = "A GitHub REST API MCP server secured by AuthPlane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "mcp[cli]>=1.12,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.22,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
